; NFSU2Telemetry - sends car telemetry to SimHub (Games list: "Need for Speed Underground 2")
[SIMHUB]
Enabled=1
; SimHub runs on this PC. Use the SimHub PC's IP if it runs elsewhere.
Host=127.0.0.1
Port=30777
; Rev limit for rev lights. 0 = use the highest rpm seen in the current race.
MaxRpm=0

; Force feedback for the wheel (Fanatec CSL DD). Turn off force feedback in the game's own
; options if it has any. Changes apply on the next game start.
[FFB]
Enabled=1
; Overall strength 0-1 of the wheelbase maximum. Start low on a direct drive base.
Gain=0.35
; 1 = flip the force direction (use if the wheel pushes away from center instead of toward it)
Invert=0
; Front wheel angle in degrees at full wheel input in the game. Lower = heavier near center.
MaxSteerDeg=25
; Front slip angle where the aligning force peaks; beyond it the wheel goes lighter (understeer)
GripPeakDeg=6
; Speed where the aligning force reaches full strength
FullForceKmh=60
; Centering spring when (almost) stopped, 0-1
StandstillSpring=0.08
; Damping handled by the wheelbase, 0-1
Damper=0.25
; Bumps from the front suspension, 0 = off
Bumps=0.5
; Kick on side impacts, 0 = off
Impacts=0.6
; Part of the device name to use; empty = Fanatec first, then any force feedback wheel
Device=

; Wheel and pedals fed straight into the game (NFSU2 can't select the wheel itself).
; Menus still use the keyboard. Changes apply on the next game start.
[INPUT]
Enabled=1
; Steering from the force feedback wheel (the same device as in [FFB])
Steering=1
; >1 = full steering lock with less wheel rotation (or lower the rotation in the Fanatec settings)
SteerScale=1.0
SteerDeadzone=0.0
; 1 = flip steering direction
SteerInvert=0
; Pedal device (part of its name) and axes: X, Y, Z, RX, RY, RZ, S0, S1, empty = not used.
; Pedals calibrate themselves: keep them released when the game starts, then press each fully once.
PedalDevice=SIMSONN Plus X
ThrottleAxis=X
BrakeAxis=Y
HandbrakeAxis=
PedalDeadzone=0.03
