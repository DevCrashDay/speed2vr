; gauge_mod - PNG gauges for NFSU2HeadTrack's in-car rev counter and speedometer.
; See README.txt for how to make your own. Changes apply after restarting the game.
;
; Face    = square PNG; the round gauge should fill the whole image (transparent corners).
; Needle  = square PNG of the same layout; the needle points straight up (12 o'clock) and
;           turns around the exact image center. Leave empty to use the built-in needle.
; MinAngle / MaxAngle = where the needle points at 0 and at MaxValue, in degrees from
;           12 o'clock, clockwise positive (-135 = 7:30 position, 135 = 4:30 position).
; MaxValue = value at MaxAngle (rpm or km/h). Must match the scale printed on your face PNG.
; Digital  = 1 shows the gear (rev counter) or the speed (speedometer) as digits on the face.
; DigitalY = vertical position of the digits (fraction of the radius, + = below the center).
; DigitalSize = digit height (fraction of the radius). DigitalColor = R,G,B[,A].

[Tachometer]
Face=tachometer.png
Needle=needle.png
MinAngle=-135
MaxAngle=135
MaxValue=9000
Digital=1
DigitalY=0.34
DigitalSize=0.26
DigitalColor=255,140,30

[Speedometer]
Face=speedometer.png
Needle=needle.png
MinAngle=-135
MaxAngle=135
MaxValue=320
Digital=1
DigitalY=0.34
DigitalSize=0.22
DigitalColor=240,240,240
